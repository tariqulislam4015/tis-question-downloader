<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <title>TIS Question Downloader</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pp-head">
    <img src="icon48.png" alt="" class="pp-logo">
    <div>
      <div class="pp-title">TIS Question Downloader</div>
      <div class="pp-ver">UMS প্রশ্ন → এক ক্লিকে Word file</div>
    </div>
  </header>
  <main>
    <div id="profile"></div>
    <div class="pp-btns">
      <a class="pp-open" href="https://umsbd.net/Exam/Question/Index" target="_blank" rel="noopener noreferrer">MCQ পেজ ↗</a>
      <a class="pp-open pp-open2" href="https://umsbd.net/Exam/OnlineWrittenQuestion/Index" target="_blank" rel="noopener noreferrer">Written পেজ ↗</a>
    </div>
    <ol class="pp-steps">
      <li>নিজে login করুন</li>
      <li>Organization → Program → Session → Course → Exam → Version select করুন</li>
      <li>পেজের নিচে ডান কোণের প্যানেলে <b>Word File Download</b> চাপুন</li>
    </ol>
  </main>
  <script src="profile.js"></script>
  <script src="popup.js"></script>
</body>
</html>
